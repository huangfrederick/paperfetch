name: CI

# Sets when workflow runs: on push to main branch and pull requests.
on:
  push:
    branches: [main]
  pull_request:

# Limits workflows permissions to read-only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pixi and the environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.82.0

      - name: Lint
        run: pixi run lint

      - name: Check formatting
        run: pixi run format --check

      - name: Test
        run: pixi run test

      - name: Smoke-test the command
        run: pixi run paperfetch --help
