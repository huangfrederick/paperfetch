[workspace]
authors = ["tzujie huang <64339052+huangfrederick@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "paperfetch"
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
paperfetch = { path = ".", editable = true }    # indicate package is defined by pyproject.toml

[feature.dev.dependencies]
ruff = "*"
pytest = "*"
ipykernel = ">=7.4.0,<8"
jupyterlab = ">=4.6.4,<5"

[feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
test = "pytest"
notebook = "jupyter lab notebooks/quickstart.ipynb"

[environments]
default = { features = ["dev"], solve-group = "default" }
