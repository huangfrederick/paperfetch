[workspace]
authors = ["tzujie huang <64339052+huangfrederick@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "paperfetch"
platforms = ["osx-arm64", "linux-64"]   # need to support windows/linux users later.
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
paperfetch = { path = ".", editable = true }    # indicate package is defined by pyproject.toml

[feature.dev.dependencies]
ruff = "*"
pytest = "*"
ipykernel = ">=7.4.0,<8"

[feature.dev.tasks]
lint = "ruff check"
format = "ruff format"
test = "pytest"

[environments]
default = { features = ["dev"], solve-group = "default" }
